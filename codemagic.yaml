workflows:
  ios-unsigned-build:
    name: iOS unsigned build (検証用)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        # SUPABASE_URL / SUPABASE_ANON_KEY を含むCodemagic側の変数グループ。
        - SUPABASE_VARIABLES
    # 手動トリガーのみ（TestFlight配信が安定して動くようになったため、
    # push毎の自動検証ビルドは停止。必要な時にダッシュボードから手動実行する）。
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Build iOS (署名なし・toolchain検証用)
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
    artifacts:
      - build/ios/iphoneos/*.app

  ios-testflight:
    name: iOS TestFlight配信
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Codemagicダッシュボードで登録したApp Store Connect APIキーの参照名。
      app_store_connect: savepoint_appstore
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.biffi.savepoint
      groups:
        # SUPABASE_URL / SUPABASE_ANON_KEY を含むCodemagic側の変数グループ。
        - SUPABASE_VARIABLES
    # 手動トリガーのみ（pushの度にTestFlightへアップロードしないようにするため）。
    # Codemagicダッシュボードの「Start new build」からこのワークフローを選んで実行する。
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for App Store
        script: |
          # TestFlightは同じビルド番号を再アップロードできないため、
          # App Store Connect上の最新ビルド番号を取得して+1する。
          # 6799825415 は App Store Connect → App情報 に表示されているSavePointのApple ID。
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "6799825415")
          # 過去のビルドでバージョン文字列（例: "1.0.0"）が混ざっている場合に備え、
          # "."より前の整数部分だけを取り出してから+1する。
          NEXT_BUILD_NUMBER=$((${LATEST_BUILD_NUMBER%%.*} + 1))
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --build-number=$NEXT_BUILD_NUMBER \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
