# 共通スクリプトステップをYAML anchorとして定義する場所。Codemagicは`workflows`以外の
# トップレベルキーを解釈しないため、`definitions`はCodemagic自体には効果を持たず、
# 下のworkflows内から`<<: *anchor_name`で参照して重複を避けるためだけに存在する
# （Codemagic公式ブログで紹介されている手法）。
#
# 5つのworkflowに分割した理由: 元は「release」1つでiOS/Androidを同時ビルド・
# パブリッシュしていたが、iOSだけ/Androidだけをビルド確認したい・パブリッシュせず
# 挙動だけ見たい、といったケースに対応するため、Build（ビルドのみ）とPublish
# （ビルド＋パブリッシュ）を独立したworkflowとして分離し、個別・組み合わせ
# どちらでも実行できるようにした。既存の統合workflow（release、iOS & Android
# Build/Publish）は動作実績を優先し、内容はそのまま維持している。
definitions:
  steps:
    flutter_packages: &step_flutter_packages
      name: Get Flutter packages
      script: flutter pub get
    unit_tests: &step_unit_tests
      name: Run unit tests
      script: flutter test
      # ここが失敗した場合はignore_failureを付けていないため、後続のビルド・
      # パブリッシュ工程は実行されずビルド全体が失敗扱いになる（意図した挙動）。
    ios_signing_settings: &step_ios_signing_settings
      name: Set up code signing settings on Xcode project
      script: |
        # testFlightInternalTestingOnly を付けることで、外部向けベータ版レビューへの
        # 自動提出を行わず、内部テストグループへの配布だけにする。
        xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
    resolve_ios_build_number: &step_resolve_ios_build_number
      name: Resolve iOS build number
      script: |
        set -euo pipefail

        # pubspec.yaml からバージョン名 (例: 1.0.0) を抽出
        APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d '+' -f 1 | tr -d '[:space:]')
        echo "APP_VERSION=$APP_VERSION" >> $CM_ENV

        # App Store Connect上の最新ビルド番号を取得して+1
        LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "6799825415")
        NEXT_BUILD_NUMBER=$((${LATEST_BUILD_NUMBER%%.*} + 1))
        echo "APP_BUILD_NUMBER=$NEXT_BUILD_NUMBER" >> $CM_ENV
    resolve_android_build_number: &step_resolve_android_build_number
      name: Resolve Android build number
      script: |
        set -euo pipefail

        # pubspec.yaml からバージョン名 (例: 1.0.0) を抽出
        APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d '+' -f 1 | tr -d '[:space:]')
        echo "APP_VERSION=$APP_VERSION" >> $CM_ENV

        # pubspec.yaml のバージョン番号（+以降のビルド番号）をAndroidのversionCodeとして使う
        ANDROID_BUILD_NUMBER=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d '+' -f 2 | tr -d '[:space:]')
        echo "ANDROID_BUILD_NUMBER=$ANDROID_BUILD_NUMBER" >> $CM_ENV
    android_signing_setup: &step_android_signing_setup
      name: Set up Android signing
      script: |
        # ANDROID_SIGNINGグループの変数が揃っている場合のみ、base64化されたキーストアを
        # 復元してandroid/key.propertiesを生成する。CI機械は毎回使い捨てのため、これを
        # 用意しないとAndroidのビルドツールが実行のたびに新しいdebug鍵を自動生成して
        # しまい、Firebase App Distributionのテスターが「アプリを更新できない」
        # （署名不一致）に陥る。未設定の場合は何もせず、android/app/build.gradle.kts
        # のフォールバック（debug鍵）に任せる。
        if [ -n "${CM_KEYSTORE:-}" ]; then
          KEYSTORE_PATH="$CM_BUILD_DIR/android/app/upload-keystore.jks"
          # macOS標準のbase64はGNU版と引数が異なり、デコードには -D を使う。
          echo "$CM_KEYSTORE" | base64 -D > "$KEYSTORE_PATH"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$CM_KEYSTORE_PASSWORD" "$CM_KEY_PASSWORD" "$CM_KEY_ALIAS" "$KEYSTORE_PATH" \
            > android/key.properties
          echo "android/key.properties を生成しました（本番鍵で署名します）。"
        else
          echo "ANDROID_SIGNINGが未設定のため、debug鍵で署名します。"
        fi
    android_sdk_preinstall: &step_android_sdk_preinstall
      name: Pre-install Android SDK Platform 37
      script: |
        set -euo pipefail
        # permission_handler_androidがcompileSdk 37でのコンパイルを要求するため
        # android/app/build.gradle.ktsでcompileSdk = 37を指定しているが、Gradle実行中に
        # このSDKコンポーネントをオンデマンドで自動ダウンロードさせると、「Failed to find
        # target with hash string 'android-37'」でl8DexDesugarLibReleaseタスクが失敗する
        # 事象を確認した（2026-08-27、ビルド#25で実際に発生。使い捨てのCI機械では
        # ローカル開発機と違い毎回このSDKが未インストールの状態からビルドが始まるため、
        # ビルド中の遅延インストールとAGPのSDKターゲット解決が競合しているとみられる）。
        # Gradle起動前に明示的にインストールしておくことで、この遅延ダウンロードそのものを
        # 回避する。
        #
        # 追記（2026-08-29、android_playstore_publishワークフローのビルド#1で実際に発生）:
        # `command -v sdkmanager`やAndroid SDKツリー全体をたどる`find`は、Android SDK
        # Tools（廃止済み、tools/bin/sdkmanager）に含まれる旧Java実装のsdkmanagerを
        # 拾ってしまうことがある。この旧実装はJDK 11以降でjavax.xml.bind（JAXB）が
        # 標準ライブラリから削除された影響を受け、
        # 「NoClassDefFoundError: javax/xml/bind/annotation/XmlSchema」で即座に落ちる。
        # 新しいAndroid SDK Command-line Tools（cmdline-tools配下、Kotlin実装）の
        # sdkmanagerはこの問題が無いため、探索対象をcmdline-tools配下だけに限定する。
        SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
        SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -f "$SDKMANAGER" ]; then
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)
        fi
        if [ -z "$SDKMANAGER" ]; then
          echo "cmdline-tools配下にsdkmanagerが見つからなかったため、プリインストールをスキップします（Gradle実行中の自動ダウンロードに委ねます）。"
        else
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0"
        fi
    build_ios_ipa: &step_build_ios_ipa
      name: Build iOS ipa
      script: |
        set -euo pipefail
        flutter build ipa --release \
          --export-options-plist=/Users/builder/export_options.plist \
          --build-number=$APP_BUILD_NUMBER \
          --dart-define=SUPABASE_URL=$SUPABASE_URL \
          --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
          --dart-define=ADMOB_BANNER_AD_UNIT_ID=${ADMOB_BANNER_AD_UNIT_ID:-} \
          --dart-define=ADMOB_NATIVE_AD_UNIT_ID=${ADMOB_NATIVE_AD_UNIT_ID:-} \
          --dart-define=ADMOB_INTERSTITIAL_AD_UNIT_ID=${ADMOB_INTERSTITIAL_AD_UNIT_ID:-} \
          --dart-define=REVENUECAT_IOS_API_KEY=${REVENUECAT_IOS_API_KEY:-} \
          --dart-define=GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID:-} \
          --dart-define=GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID:-}

        # クラッシュレポート（Crashlytics）のスタックトレースをシンボリケートできるよう、
        # dSYMをアップロードする。
        # 注意: `firebase crashlytics:symbols:upload`（firebase-tools CLI）はAndroid(NDK)の
        # ネイティブライブラリ（.so）向けのツールで、iOSのdSYM（Swift/Objective-Cの
        # デバッグ情報）には対応していない（"No native libraries found"で失敗する）。
        # upload-symbolsバイナリが必要だが、Firebase一式はCocoaPodsではなくSPMで
        # 取得されるようになったため ios/Pods/FirebaseCrashlytics/upload-symbols は
        # 存在しない（"No such file or directory"で失敗する）。SPMのパッケージ
        # チェックアウト先（キャッシュ・DerivedData双方）を横断的に探して使う。
        # 失敗してもビルド自体は継続させる（|| echoで握りつぶす）。
        UPLOAD_SYMBOLS=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
              "$HOME/Library/Caches/org.swift.swiftpm" \
              ios \
              -type f -name upload-symbols 2>/dev/null | head -n 1)
        # 上記の既知パスで見つからない場合、SPMのキャッシュ先がXcodeバージョンや
        # ビルド設定によって変わることがあるため、$HOME全体に検索範囲を広げる
        # （それでも見つからない場合は、次回の原因調査用にFirebaseCrashlytics関連
        # ディレクトリの一覧をログに残す）。
        if [ -z "$UPLOAD_SYMBOLS" ]; then
          echo "既知のパスでupload-symbolsが見つからなかったため、\$HOME全体を再検索します。"
          UPLOAD_SYMBOLS=$(find "$HOME" -type f -name upload-symbols 2>/dev/null | head -n 1)
        fi
        if [ -n "$UPLOAD_SYMBOLS" ]; then
          echo "upload-symbolsが見つかりました: $UPLOAD_SYMBOLS"
          find build/ios/archive/Runner.xcarchive/dSYMs -name '*.dSYM' -print0 2>/dev/null \
            | xargs -0 -I{} "$UPLOAD_SYMBOLS" \
                -gsp ios/Runner/GoogleService-Info.plist \
                -p ios \
                {} || echo "dSYMのアップロードに失敗しましたが、ビルド自体は継続します。"
        else
          echo "upload-symbolsが\$HOME全体を探しても見つかりませんでした。調査用にFirebaseCrashlytics関連ディレクトリを一覧表示します:"
          find "$HOME/Library/Developer/Xcode/DerivedData" -iname '*firebasecrashlytics*' 2>/dev/null | head -n 30
          echo "dSYMのアップロードをスキップします。"
        fi

        touch /tmp/ios_build_success
      # ビルドが失敗しても後続のDiscord通知は実行し、失敗をDiscordに通知できるように
      # する（/tmp/ios_build_successの有無で成否を判定する）。
      ignore_failure: true
    build_android_apk: &step_build_android_apk
      name: Build Android APK
      script: |
        set -euo pipefail
        # Firebase App Distributionのテスターはほぼ全員arm64実機のため、
        # --target-platform=android-arm64でビルド対象アーキテクチャを絞り、
        # armv7・x86_64向けの重複ビルド・パッケージングを省いてビルド時間を短縮する。
        flutter build apk --release \
          --target-platform=android-arm64 \
          --dart-define=SUPABASE_URL=$SUPABASE_URL \
          --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
          --dart-define=ADMOB_BANNER_AD_UNIT_ID=${ADMOB_BANNER_AD_UNIT_ID:-} \
          --dart-define=ADMOB_NATIVE_AD_UNIT_ID=${ADMOB_NATIVE_AD_UNIT_ID:-} \
          --dart-define=ADMOB_INTERSTITIAL_AD_UNIT_ID=${ADMOB_INTERSTITIAL_AD_UNIT_ID:-} \
          --dart-define=REVENUECAT_ANDROID_API_KEY=${REVENUECAT_ANDROID_API_KEY:-} \
          --dart-define=GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID:-}

        touch /tmp/android_build_success
      # ビルドが失敗しても後続のDiscord通知は実行し、失敗をDiscordに通知できるように
      # する（/tmp/android_build_successの有無で成否を判定する）。
      ignore_failure: true
    build_android_appbundle: &step_build_android_appbundle
      name: Build Android App Bundle
      script: |
        set -euo pipefail
        # Google Playへの提出には.apkではなく.aab（App Bundle）が必須。Play Store側で
        # 端末ごとに最適なABIを配信するため、Firebase App Distribution向けAPKと違い
        # --target-platform=android-arm64には絞らない（全ABIを含める）。
        flutter build appbundle --release \
          --dart-define=SUPABASE_URL=$SUPABASE_URL \
          --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
          --dart-define=ADMOB_BANNER_AD_UNIT_ID=${ADMOB_BANNER_AD_UNIT_ID:-} \
          --dart-define=ADMOB_NATIVE_AD_UNIT_ID=${ADMOB_NATIVE_AD_UNIT_ID:-} \
          --dart-define=ADMOB_INTERSTITIAL_AD_UNIT_ID=${ADMOB_INTERSTITIAL_AD_UNIT_ID:-} \
          --dart-define=REVENUECAT_ANDROID_API_KEY=${REVENUECAT_ANDROID_API_KEY:-} \
          --dart-define=GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID:-}

        touch /tmp/android_appbundle_build_success
      ignore_failure: true
    publish_ios_testflight: &step_publish_ios_testflight
      name: Publish to TestFlight
      script: |
        set -euo pipefail
        HTTP_STATUS=""
        if [ -f /tmp/ios_build_success ]; then
          IPA_PATH=$(find build/ios/ipa -name '*.ipa' | head -n 1)
          app-store-connect publish --path "$IPA_PATH"

          # TestFlightはストアの自動更新チェックが効かないため、app_versionsテーブルに
          # 最新ビルド番号を反映し、アプリ側で古いビルドを検知して強制アップデート画面を
          # 出せるようにする（SUPABASE_SERVICE_ROLE_KEYが未設定の場合はスキップし、
          # TestFlightへのパブリッシュ自体は成功のまま完了させる）。
          # curlの失敗（-fで非2xx時に非ゼロ終了）がset -eでスクリプト全体を道連れにし、
          # 実際にはTestFlightへのアップロードが成功しているのに「スキップ」と誤報される
          # 事態を防ぐため、この更新はベストエフォート（失敗してもパブリッシュ成功として扱う）にする。
          if [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            set +e
            HTTP_STATUS=$(curl -sS -o /tmp/app_versions_ios_response.json -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/app_versions" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: resolution=merge-duplicates" \
              -d "$(jq -n --arg build "$APP_BUILD_NUMBER" '{platform:"ios", latest_build: ($build|tonumber), update_url: "itms-beta://"}')")
            CURL_EXIT=$?
            set -e
            if [ "$CURL_EXIT" -ne 0 ]; then
              HTTP_STATUS="curl失敗(exit=$CURL_EXIT)"
            fi
            case "${HTTP_STATUS:-}" in
              200|201|204)
                echo "app_versions（ios）を更新しました: build=$APP_BUILD_NUMBER" ;;
              *)
                echo "app_versions（ios）の更新に失敗しました（HTTP ${HTTP_STATUS:-不明}）。TestFlightへのパブリッシュ自体は成功として扱います。"
                cat /tmp/app_versions_ios_response.json 2>/dev/null || true ;;
            esac
          else
            echo "SUPABASE_SERVICE_ROLE_KEYが未設定のため、app_versionsの更新をスキップしました。"
          fi
          touch /tmp/ios_publish_success
        else
          echo "iOSビルドが失敗したため、TestFlightへのパブリッシュをスキップしました。"
        fi
      # ビルド失敗時はスキップするだけで、後続のDiscord通知は必ず実行したいため
      # ここでもignore_failureを付ける（/tmp/ios_publish_successの有無で成否を判定する）。
      ignore_failure: true
    publish_android_firebase: &step_publish_android_firebase
      name: Publish to Firebase App Distribution
      script: |
        set -euo pipefail
        HTTP_STATUS=""
        if [ -f /tmp/android_build_success ]; then
          # Codemagicのmacイメージにはfirebase-toolsがプリインストール済みのため、
          # 既にある場合はグローバルインストールをスキップする（EEXISTで失敗するのを防ぐ）。
          if ! command -v firebase >/dev/null 2>&1; then
            npm install -g firebase-tools
          fi
          # テスターはCodemagic側（このYAML）ではなくFirebase App Distribution側の
          # 「testers」グループで管理する。グループにテスターを追加・削除するだけで
          # 次回配布から自動的に反映され、ここを編集する必要はない。
          # --jsonでテスター向けダウンロードリンク（testingUri）を機械可読な形で取得する。
          FIREBASE_OUTPUT=$(firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app 1:763009686501:android:22db046778e22c10c1ed0c \
            --groups "testers" \
            --token "$FIREBASE_TOKEN" \
            --json)
          echo "$FIREBASE_OUTPUT"
          # firebase-toolsのバージョンによって--json出力のトップレベル形が変わる
          # ことがあるため、想定されるいくつかの場所を順に試す。
          TESTING_URI=$(echo "$FIREBASE_OUTPUT" | jq -r '.result.testingUri // .testingUri // .release.testingUri // empty')
          echo "テスター向けダウンロードリンク: ${TESTING_URI:-取得できませんでした}"

          # app_versionsテーブルに最新ビルド番号とダウンロードリンクを反映する
          # （SUPABASE_SERVICE_ROLE_KEYが未設定の場合はスキップし、Firebaseへの
          # パブリッシュ自体は成功のまま完了させる）。
          if [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            set +e
            HTTP_STATUS=$(curl -sS -o /tmp/app_versions_android_response.json -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/app_versions" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: resolution=merge-duplicates" \
              -d "$(jq -n --arg build "$ANDROID_BUILD_NUMBER" --arg url "$TESTING_URI" \
                '{platform:"android", latest_build: ($build|tonumber), update_url: $url}')")
            CURL_EXIT=$?
            set -e
            if [ "$CURL_EXIT" -ne 0 ]; then
              HTTP_STATUS="curl失敗(exit=$CURL_EXIT)"
            fi
            case "${HTTP_STATUS:-}" in
              200|201|204)
                echo "app_versions（android）を更新しました: build=$ANDROID_BUILD_NUMBER" ;;
              *)
                echo "app_versions（android）の更新に失敗しました（HTTP ${HTTP_STATUS:-不明}）。Firebaseへのパブリッシュ自体は成功として扱います。"
                cat /tmp/app_versions_android_response.json 2>/dev/null || true ;;
            esac
          else
            echo "SUPABASE_SERVICE_ROLE_KEYが未設定のため、app_versionsの更新をスキップしました。"
          fi
          touch /tmp/android_publish_success
        else
          echo "Androidビルドが失敗したため、Firebase App Distributionへのパブリッシュをスキップしました。"
        fi
      ignore_failure: true

  # 変数グループの説明（各workflowで実際に使う分だけ参照する）。
  groups_doc: &groups_doc |
    SUPABASE_VARIABLES_PROD: 本番Supabaseプロジェクト（hjqgeewbuwuxwyorceog）のSUPABASE_URL /
      SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEYを含む。2026-08-29、devプロジェクト
      （lsitiazbafrgeyklcckc）向けのSUPABASE_VARIABLESから全ワークフローで切り替えた。
      AdMob本番広告ユニットID・RevenueCat公開SDKキーもこのグループに相乗りさせている。
      未設定の項目はテスト広告IDへのフォールバックや機能無効化に留まり、ビルド自体は失敗しない。
    DISCORD_VARIABLES: DISCORD_WEBHOOK_URL を含む。
    FIREBASE_VARIABLES: FIREBASE_TOKEN（firebase appdistribution:distribute の認証用）を含む。
    ANDROID_SIGNING: CM_KEYSTORE / CM_KEYSTORE_PASSWORD / CM_KEY_ALIAS / CM_KEY_PASSWORD を含む。
      未設定の場合はdebug鍵にフォールバックする（ビルド自体は失敗しない）。ただしPlay Storeは
      debug鍵での提出を受け付けないため、android_playstore_publishワークフローでは
      このグループの設定が事実上必須。
    GOOGLE_PLAY_VARIABLES: GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS（Google Play Console
      「API アクセス」で発行したサービスアカウントのJSONキーファイルの中身をそのまま、
      Secret変数として登録する。base64化は不要）を含む。Play Console側でこの
      サービスアカウントに「製品版・テスト版へのリリースの管理」権限を付与しておくこと。

  ios_signing_block: &ios_signing_block
    distribution_type: app_store
    bundle_identifier: com.biffi.savepoint
    # iOSホーム画面ウィジェット（BacklogWidgetExtension、ios/BacklogWidgetExtension/）
    # 追加に伴い、Apple Developer Portal側で以下の作業が必要（実際のビルド失敗で確認済み）:
    #   1. App ID「com.biffi.savepoint.BacklogWidgetExtension」を新規登録し、
    #      App Groups capability（group.com.biffi.savepoint）を有効化する。
    #      本体App ID（com.biffi.savepoint）側にもApp Groups capabilityを追加し、
    #      同じグループを紐付ける。
    #   2. 本体アプリの既存プロビジョニングプロファイル（SavePoint App Store）を
    #      再生成する。App IDにcapabilityを追加しても発行済みプロファイルには
    #      自動反映されないため、再生成しないとApp Groupsのentitlementが
    #      欠けたままビルドが失敗する。
    #   3. 拡張機能用の新規プロファイル（Distribution / App Store、
    #      com.biffi.savepoint.BacklogWidgetExtension向け、既存の配布証明書を使用）を
    #      作成する。Codemagicの自動署名は本体bundle_identifierに対して
    #      `com.biffi.savepoint.*`形式の拡張機能用プロファイルを自動検索するが、
    #      未作成のプロファイルを拡張機能分だけ自動生成することはしないため、
    #      手動で一度作成しておく必要がある（bundle_identifierフィールドは単一の
    #      文字列のみ対応でリスト化はできない。docs.codemagic.io/yaml-code-signing/
    #      signing-ios/で確認済み）。
    #
    # プッシュ通知（FCM、ios/Runner/Runner.entitlementsのaps-environment）追加に伴い、
    # 同じ理由で実際にビルド失敗を確認済み（2026-08-26）: 「Provisioning profile
    # "SavePoint App Store" doesn't include the Push Notifications capability /
    # aps-environment entitlement」。App ID側でPush Notifications capabilityを
    # 有効化した上で、本体の配布用プロビジョニングプロファイル（SavePoint App Store）を
    # 再生成する必要がある（App Groupsの時と同様、capability追加だけでは既発行の
    # プロファイルには自動反映されない）。

workflows:
  # ---------------------------------------------------------------
  # iOS TestFlight Build: iOSのビルドのみ行い、TestFlightへはパブリッシュしない。
  # コード署名・ビルドが通るかどうかだけを確認したい時に使う。
  # ---------------------------------------------------------------
  ios_build:
    name: iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: savepoint_appstore
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        <<: *ios_signing_block
      groups:
        - SUPABASE_VARIABLES_PROD
        - DISCORD_VARIABLES
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $CM_BUILD_DIR/.dart_tool
        - $HOME/Library/Caches/org.swift.swiftpm
    scripts:
      - *step_flutter_packages
      - *step_unit_tests
      - *step_ios_signing_settings
      - *step_resolve_ios_build_number
      - *step_build_ios_ipa
      - name: Notify Discord
        script: |
          set -euo pipefail
          COMMIT_HASH=$(echo "${CM_COMMIT}" | cut -c 1-7)
          IOS_LINE="iOS Build：失敗"
          if [ -f /tmp/ios_build_success ]; then
            IOS_LINE="iOS Build：成功（パブリッシュはしていません。Version：${APP_VERSION} / Build：${APP_BUILD_NUMBER}）"
          fi
          MESSAGE="SavePointのiOSビルドが完了しました。
          ${IOS_LINE}
          Commit：${COMMIT_HASH}"
          JSON_PAYLOAD=$(jq -n --arg content "$MESSAGE" '{content: $content}')
          curl -H "Content-Type: application/json" -X POST -d "$JSON_PAYLOAD" "$DISCORD_WEBHOOK_URL"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  # ---------------------------------------------------------------
  # iOS TestFlight Build & Publish: iOSをビルドし、TestFlightへパブリッシュまで行う。
  # ---------------------------------------------------------------
  ios_build_publish:
    name: iOS TestFlight Build & Publish
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: savepoint_appstore
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        <<: *ios_signing_block
      groups:
        - SUPABASE_VARIABLES_PROD
        - DISCORD_VARIABLES
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $CM_BUILD_DIR/.dart_tool
        - $HOME/Library/Caches/org.swift.swiftpm
    scripts:
      - *step_flutter_packages
      - *step_unit_tests
      - *step_ios_signing_settings
      - *step_resolve_ios_build_number
      - *step_build_ios_ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      scripts:
        - *step_publish_ios_testflight
        - name: Notify Discord
          script: |
            set -euo pipefail
            COMMIT_HASH=$(echo "${CM_COMMIT}" | cut -c 1-7)
            IOS_LINE="iOS TestFlight：スキップ（ビルドまたはパブリッシュ失敗）"
            if [ -f /tmp/ios_publish_success ]; then
              IOS_LINE="iOS TestFlight：成功＆パブリッシュ済み（Version：${APP_VERSION} / Build：${APP_BUILD_NUMBER}）"
            fi
            MESSAGE="SavePointのiOSビルドが完了しました。
            ${IOS_LINE}
            Commit：${COMMIT_HASH}"
            JSON_PAYLOAD=$(jq -n --arg content "$MESSAGE" '{content: $content}')
            curl -H "Content-Type: application/json" -X POST -d "$JSON_PAYLOAD" "$DISCORD_WEBHOOK_URL"

  # ---------------------------------------------------------------
  # Android Build: Androidのビルドのみ行い、Firebase App Distributionへは
  # パブリッシュしない。
  # ---------------------------------------------------------------
  android_build:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups:
        - SUPABASE_VARIABLES_PROD
        - ANDROID_SIGNING
        - DISCORD_VARIABLES
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.pub-cache
        - $CM_BUILD_DIR/.dart_tool
        - $CM_BUILD_DIR/android/.gradle
    scripts:
      - *step_flutter_packages
      - *step_unit_tests
      - *step_resolve_android_build_number
      - *step_android_signing_setup
      - *step_android_sdk_preinstall
      - *step_build_android_apk
      - name: Notify Discord
        script: |
          set -euo pipefail
          COMMIT_HASH=$(echo "${CM_COMMIT}" | cut -c 1-7)
          ANDROID_LINE="Android Build：失敗"
          if [ -f /tmp/android_build_success ]; then
            ANDROID_LINE="Android Build：成功（Firebaseへのパブリッシュはしていません。Version：${APP_VERSION} / Build：${ANDROID_BUILD_NUMBER}）"
          fi
          MESSAGE="SavePointのAndroidビルドが完了しました。
          ${ANDROID_LINE}
          Commit：${COMMIT_HASH}"
          JSON_PAYLOAD=$(jq -n --arg content "$MESSAGE" '{content: $content}')
          curl -H "Content-Type: application/json" -X POST -d "$JSON_PAYLOAD" "$DISCORD_WEBHOOK_URL"
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  # ---------------------------------------------------------------
  # Android Build & Publish: Androidをビルドし、Firebase App Distributionへ
  # パブリッシュまで行う。
  # ---------------------------------------------------------------
  android_build_publish:
    name: Android Build & Publish
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups:
        - SUPABASE_VARIABLES_PROD
        - ANDROID_SIGNING
        - FIREBASE_VARIABLES
        - DISCORD_VARIABLES
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.pub-cache
        - $CM_BUILD_DIR/.dart_tool
        - $CM_BUILD_DIR/android/.gradle
    scripts:
      - *step_flutter_packages
      - *step_unit_tests
      - *step_resolve_android_build_number
      - *step_android_signing_setup
      - *step_android_sdk_preinstall
      - *step_build_android_apk
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      scripts:
        - *step_publish_android_firebase
        - name: Notify Discord
          script: |
            set -euo pipefail
            COMMIT_HASH=$(echo "${CM_COMMIT}" | cut -c 1-7)
            ANDROID_LINE="Android Firebase App Distribution：スキップ（ビルドまたはパブリッシュ失敗）"
            if [ -f /tmp/android_publish_success ]; then
              ANDROID_LINE="Android Firebase App Distribution：成功＆パブリッシュ済み（Version：${APP_VERSION} / Build：${ANDROID_BUILD_NUMBER}）"
            fi
            MESSAGE="SavePointのAndroidビルドが完了しました。
            ${ANDROID_LINE}
            Commit：${COMMIT_HASH}"
            JSON_PAYLOAD=$(jq -n --arg content "$MESSAGE" '{content: $content}')
            curl -H "Content-Type: application/json" -X POST -d "$JSON_PAYLOAD" "$DISCORD_WEBHOOK_URL"

  # ---------------------------------------------------------------
  # Android Play Store Publish: .aab（App Bundle）をビルドし、Google Playへ
  # パブリッシュする。Firebase App Distribution向け（android_build_publish）とは
  # 別workflowにしている。配布先が「社内テスター」から「Google Playのテストトラック
  # /本番」に変わる、性質の異なる操作を毎回のテストビルドと同じ引き金で走らせたくない
  # ため（意図的に分離）。
  #
  # 事前準備（BIFFI本人の作業、コード側では代行できない）:
  #   1. Google Play Console → 設定 → API アクセス で、Google Cloudの新規サービス
  #      アカウントを作成しリンクする。作成したサービスアカウントのJSONキーを発行する。
  #   2. Play Console → ユーザーとアクセス権 で、そのサービスアカウントに
  #      「製品版・テスト版へのリリースの管理」権限を付与する。
  #   3. JSONキーの中身をそのままCodemagicのGOOGLE_PLAY_VARIABLESグループの
  #      GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALSに登録する（base64化不要、Secret推奨）。
  #   4. 【重要】Google PlayはAPI経由での「新規アプリの初回アップロード」を許可していない。
  #      アプリ自体をPlay Consoleでまだ作成していない場合は、最初の1回だけ手動で
  #      .aabをアップロードしてアプリを作成し、その後このworkflowに引き継ぐ必要がある。
  # ---------------------------------------------------------------
  android_playstore_publish:
    name: Android Play Store Publish
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups:
        - SUPABASE_VARIABLES_PROD
        - ANDROID_SIGNING
        - GOOGLE_PLAY_VARIABLES
        - DISCORD_VARIABLES
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.pub-cache
        - $CM_BUILD_DIR/.dart_tool
        - $CM_BUILD_DIR/android/.gradle
    scripts:
      - *step_flutter_packages
      - *step_unit_tests
      - *step_resolve_android_build_number
      - *step_android_signing_setup
      - *step_android_sdk_preinstall
      - *step_build_android_appbundle
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        # 初回運用時の事故を避けるため、内部テストトラック・ドラフト提出をデフォルトにする。
        # 動作に慣れてきたら track を alpha/beta/production に、submit_as_draft を
        # false に変更する（本番へ出す場合はrollout_fractionで段階的公開も検討する）。
        track: internal
        submit_as_draft: true
      scripts:
        - name: Notify Discord
          script: |
            set -euo pipefail
            COMMIT_HASH=$(echo "${CM_COMMIT}" | cut -c 1-7)
            MESSAGE="SavePointのAndroidアプリバンドルをGoogle Play（internalトラック・ドラフト）に提出しました。
            Version：${APP_VERSION} / Build：${ANDROID_BUILD_NUMBER}
            Commit：${COMMIT_HASH}"
            JSON_PAYLOAD=$(jq -n --arg content "$MESSAGE" '{content: $content}')
            curl -H "Content-Type: application/json" -X POST -d "$JSON_PAYLOAD" "$DISCORD_WEBHOOK_URL"

  # ---------------------------------------------------------------
  # iOS & Android Build/Publish: 両OSを同一マシン上で並行ビルド・パブリッシュする
  # 統合workflow（分割前から存在する、動作実績のあるworkflow。内容は変更していない）。
  # ---------------------------------------------------------------
  release:
    name: iOS & Android Build/Publish
    max_build_duration: 60
    # iOSのコード署名・ipaビルドにはmacが必須。AndroidのAPKビルドも同じマシン上で
    # バックグラウンドジョブとして並行実行する（詳細は各scriptのコメント参照）。
    instance_type: mac_mini_m2
    integrations:
      # Codemagicダッシュボードで登録したApp Store Connect APIキーの参照名
      app_store_connect: savepoint_appstore
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        <<: *ios_signing_block
      groups:
        - SUPABASE_VARIABLES_PROD
        # DISCORD_WEBHOOK_URL を含むCodemagic側の変数グループ（ダッシュボード名と完全一致させてください）
        - DISCORD_VARIABLES
        # FIREBASE_TOKEN（firebase appdistribution:distribute の認証用）を含むCodemagic側の変数グループ
        - FIREBASE_VARIABLES
        # Android本番署名用。以下4つの変数を含むグループ（ダッシュボード名と完全一致させてください）:
        #   CM_KEYSTORE           — android/app/upload-keystore.jksをbase64エンコードした
        #                           文字列（Codemagicはファイルの直接アップロードではなく、
        #                           base64化したテキストをSecret変数として保存する方式）
        #   CM_KEYSTORE_PASSWORD  — キーストアのパスワード
        #   CM_KEY_ALIAS          — "upload"
        #   CM_KEY_PASSWORD       — キーのパスワード（このプロジェクトではstore passwordと同じ）
        # 未設定の場合はdebug鍵にフォールバックする（ビルド自体は失敗しない）。
        - ANDROID_SIGNING
    cache:
      # Android SDK Platformの再ダウンロード・Gradleの依存解決・CocoaPodsの再取得を
      # ビルド間で省略できるようにし、ビルド時間を短縮する。
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.pub-cache
        - $CM_BUILD_DIR/.dart_tool
        - $CM_BUILD_DIR/android/.gradle
        # Firebase導入後、iOS側の依存はCocoaPodsではなくXcodeのSwift Package Managerで
        # 取得されるようになった（sign_in_with_apple単体はCocoaPods、Firebase一式は
        # SPM）。CocoaPodsキャッシュはもうダウンロード時間の大部分を占めるFirebase系
        # バイナリ（grpc-binary・abseil-cpp-binary等）を捕捉できていなかったため、
        # 実際にSPMが使うキャッシュ先に差し替える。
        - $HOME/Library/Caches/org.swift.swiftpm
        # Android SDK platforms/build-toolsのキャッシュは以前ここにあったが、
        # SPMキャッシュ追加後にアーカイブ合計が4.5GBに達しCodemagicの上限(3GB)を
        # 超過し、キャッシュそのものが毎回破棄される事態になったため外した。
        # sdkmanagerでの単一プラットフォーム再ダウンロードはGradle/SPMの依存解決
        # ほど時間がかからないため、優先度の低いこちらを落として3GB以内に収める。
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Run unit tests
        script: flutter test
        # ここが失敗した場合はignore_failureを付けていないため、後続のビルド・
        # パブリッシュ工程は実行されずビルド全体が失敗扱いになる（意図した挙動）。
      - name: Set up code signing settings on Xcode project
        script: |
          # testFlightInternalTestingOnly を付けることで、外部向けベータ版レビューへの
          # 自動提出を行わず、内部テストグループへの配布だけにする。
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Resolve build numbers
        script: |
          set -euo pipefail

          # pubspec.yaml からバージョン名 (例: 1.0.0) を抽出
          APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d '+' -f 1 | tr -d '[:space:]')
          echo "APP_VERSION=$APP_VERSION" >> $CM_ENV

          # App Store Connect上の最新ビルド番号を取得して+1（iOS用）
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "6799825415")
          NEXT_BUILD_NUMBER=$((${LATEST_BUILD_NUMBER%%.*} + 1))
          echo "APP_BUILD_NUMBER=$NEXT_BUILD_NUMBER" >> $CM_ENV

          # pubspec.yaml のバージョン番号（+以降のビルド番号）をAndroidのversionCodeとして使う
          ANDROID_BUILD_NUMBER=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d '+' -f 2 | tr -d '[:space:]')
          echo "ANDROID_BUILD_NUMBER=$ANDROID_BUILD_NUMBER" >> $CM_ENV
      - name: Set up Android signing
        script: |
          # ANDROID_SIGNINGグループの変数が揃っている場合のみ、base64化されたキーストアを
          # 復元してandroid/key.propertiesを生成する。CI機械は毎回使い捨てのため、これを
          # 用意しないとAndroidのビルドツールが実行のたびに新しいdebug鍵を自動生成して
          # しまい、Firebase App Distributionのテスターが「アプリを更新できない」
          # （署名不一致）に陥る。未設定の場合は何もせず、android/app/build.gradle.kts
          # のフォールバック（debug鍵）に任せる。
          if [ -n "${CM_KEYSTORE:-}" ]; then
            KEYSTORE_PATH="$CM_BUILD_DIR/android/app/upload-keystore.jks"
            # macOS標準のbase64はGNU版と引数が異なり、デコードには -D を使う。
            echo "$CM_KEYSTORE" | base64 -D > "$KEYSTORE_PATH"
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
              "$CM_KEYSTORE_PASSWORD" "$CM_KEY_PASSWORD" "$CM_KEY_ALIAS" "$KEYSTORE_PATH" \
              > android/key.properties
            echo "android/key.properties を生成しました（本番鍵で署名します）。"
          else
            echo "ANDROID_SIGNINGが未設定のため、debug鍵で署名します。"
          fi
      - *step_android_sdk_preinstall
      - name: Build iOS ipa and Android APK in parallel
        script: |
          # iOS（xcodebuild）とAndroid（Gradle）は別ツールチェーンのため、同一マシン上でも
          # バックグラウンドジョブ（&）として同時に走らせられる。それぞれをサブシェルにして
          # 個別に `set -euo pipefail` を効かせつつ、外側のスクリプトはwaitの戻り値で
          # 成否を判定する（外側で-eを使うと1つ目のwait失敗で即終了し、2つ目の結果を
          # 待たずにスクリプトが止まってしまうため、あえて付けていない）。
          #
          # 注意: 2つの `flutter build` を同一プロジェクトディレクトリに対して同時実行するため、
          # 稀にFlutter側の内部ロック（Cache/pub取得まわり）で片方が一瞬待たされることがあるが、
          # 処理自体は安全に完了する。ビルド生成物の出力先（build/ios と build/app）は
          # 分かれているため、成果物が競合することはない。

          (
            set -euo pipefail
            flutter build ipa --release \
              --export-options-plist=/Users/builder/export_options.plist \
              --build-number=$APP_BUILD_NUMBER \
              --dart-define=SUPABASE_URL=$SUPABASE_URL \
              --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
              --dart-define=ADMOB_BANNER_AD_UNIT_ID=${ADMOB_BANNER_AD_UNIT_ID:-} \
              --dart-define=ADMOB_NATIVE_AD_UNIT_ID=${ADMOB_NATIVE_AD_UNIT_ID:-} \
              --dart-define=ADMOB_INTERSTITIAL_AD_UNIT_ID=${ADMOB_INTERSTITIAL_AD_UNIT_ID:-} \
              --dart-define=REVENUECAT_IOS_API_KEY=${REVENUECAT_IOS_API_KEY:-} \
              --dart-define=GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID:-} \
              --dart-define=GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID:-}

            # クラッシュレポート（Crashlytics）のスタックトレースをシンボリケートできるよう、
            # dSYMをアップロードする。
            # 注意: `firebase crashlytics:symbols:upload`（firebase-tools CLI）はAndroid(NDK)の
            # ネイティブライブラリ（.so）向けのツールで、iOSのdSYM（Swift/Objective-Cの
            # デバッグ情報）には対応していない（"No native libraries found"で失敗する）。
            # upload-symbolsバイナリが必要だが、Firebase一式はCocoaPodsではなくSPMで
            # 取得されるようになったため ios/Pods/FirebaseCrashlytics/upload-symbols は
            # 存在しない（"No such file or directory"で失敗する）。SPMのパッケージ
            # チェックアウト先（キャッシュ・DerivedData双方）を横断的に探して使う。
            # 失敗してもTestFlightへのパブリッシュ自体は継続させる（|| echoで握りつぶす）。
            UPLOAD_SYMBOLS=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
                  "$HOME/Library/Caches/org.swift.swiftpm" \
                  ios \
                  -type f -name upload-symbols 2>/dev/null | head -n 1)
            # 上記の既知パスで見つからない場合、SPMのキャッシュ先がXcodeバージョンや
            # ビルド設定によって変わることがあるため、$HOME全体に検索範囲を広げる
            # （それでも見つからない場合は、次回の原因調査用にFirebaseCrashlytics関連
            # ディレクトリの一覧をログに残す）。
            if [ -z "$UPLOAD_SYMBOLS" ]; then
              echo "既知のパスでupload-symbolsが見つからなかったため、\$HOME全体を再検索します。"
              UPLOAD_SYMBOLS=$(find "$HOME" -type f -name upload-symbols 2>/dev/null | head -n 1)
            fi
            if [ -n "$UPLOAD_SYMBOLS" ]; then
              echo "upload-symbolsが見つかりました: $UPLOAD_SYMBOLS"
              find build/ios/archive/Runner.xcarchive/dSYMs -name '*.dSYM' -print0 2>/dev/null \
                | xargs -0 -I{} "$UPLOAD_SYMBOLS" \
                    -gsp ios/Runner/GoogleService-Info.plist \
                    -p ios \
                    {} || echo "dSYMのアップロードに失敗しましたが、ビルド自体は継続します。"
            else
              echo "upload-symbolsが\$HOME全体を探しても見つかりませんでした。調査用にFirebaseCrashlytics関連ディレクトリを一覧表示します:"
              find "$HOME/Library/Developer/Xcode/DerivedData" -iname '*firebasecrashlytics*' 2>/dev/null | head -n 30
              echo "dSYMのアップロードをスキップします。"
            fi
          ) > /tmp/ios_build.log 2>&1 &
          IOS_BUILD_PID=$!

          (
            set -euo pipefail
            # Firebase App Distributionのテスターはほぼ全員arm64実機のため、
            # --target-platform=android-arm64でビルド対象アーキテクチャを絞り、
            # armv7・x86_64向けの重複ビルド・パッケージングを省いてビルド時間を短縮する。
            flutter build apk --release \
              --target-platform=android-arm64 \
              --dart-define=SUPABASE_URL=$SUPABASE_URL \
              --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
              --dart-define=ADMOB_BANNER_AD_UNIT_ID=${ADMOB_BANNER_AD_UNIT_ID:-} \
              --dart-define=ADMOB_NATIVE_AD_UNIT_ID=${ADMOB_NATIVE_AD_UNIT_ID:-} \
              --dart-define=ADMOB_INTERSTITIAL_AD_UNIT_ID=${ADMOB_INTERSTITIAL_AD_UNIT_ID:-} \
              --dart-define=REVENUECAT_ANDROID_API_KEY=${REVENUECAT_ANDROID_API_KEY:-} \
              --dart-define=GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID:-}
          ) > /tmp/android_build.log 2>&1 &
          ANDROID_BUILD_PID=$!

          # ここで両方のビルド完了を待ち合わせる（join）。
          wait $IOS_BUILD_PID; IOS_BUILD_STATUS=$?
          wait $ANDROID_BUILD_PID; ANDROID_BUILD_STATUS=$?

          echo "----- iOS build log -----"
          cat /tmp/ios_build.log
          echo "----- Android build log -----"
          cat /tmp/android_build.log

          if [ $IOS_BUILD_STATUS -eq 0 ]; then
            touch /tmp/build_success
          else
            echo "iOSビルドが失敗しました（exit=$IOS_BUILD_STATUS）"
          fi

          if [ $ANDROID_BUILD_STATUS -eq 0 ]; then
            touch /tmp/android_build_success
          else
            echo "Androidビルドが失敗しました（exit=$ANDROID_BUILD_STATUS）"
          fi
        # ビルドが失敗してもpublishingフェーズ（パブリッシング・Discord通知）は実行し、
        # 失敗をDiscordに通知できるようにする（成功フラグの有無で成否を判定する）。
        ignore_failure: true
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      scripts:
        - name: Publish iOS and Android in parallel
          script: |
            # iOSはApp Store Connect（TestFlight向けアップロードのみ、グループへの
            # 自動提出はしない）、AndroidはFirebase App Distributionへ、それぞれ
            # バックグラウンドジョブとして同時にパブリッシュし、両方の完了を待ち合わせる。

            (
              set -euo pipefail
              HTTP_STATUS=""
              if [ -f /tmp/build_success ]; then
                IPA_PATH=$(find build/ios/ipa -name '*.ipa' | head -n 1)
                app-store-connect publish --path "$IPA_PATH"

                # TestFlight/Firebase配信はストアの自動更新チェックが効かないため、
                # app_versionsテーブルに最新ビルド番号を反映し、アプリ側で古いビルドを
                # 検知して強制アップデート画面を出せるようにする（SUPABASE_SERVICE_ROLE_KEYが
                # 未設定の場合はスキップし、TestFlightへのパブリッシュ自体は成功のまま完了させる）。
                # curlの失敗（-fで非2xx時に非ゼロ終了）がset -eでサブシェル全体を道連れにし、
                # 実際にはTestFlightへのアップロードが成功しているのに「スキップ」と誤報される
                # 事態を防ぐため、この更新はベストエフォート（失敗してもパブリッシュ成功として扱う）にする。
                if [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
                  set +e
                  HTTP_STATUS=$(curl -sS -o /tmp/app_versions_ios_response.json -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/app_versions" \
                    -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                    -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                    -H "Content-Type: application/json" \
                    -H "Prefer: resolution=merge-duplicates" \
                    -d "$(jq -n --arg build "$APP_BUILD_NUMBER" '{platform:"ios", latest_build: ($build|tonumber), update_url: "itms-beta://"}')")
                  CURL_EXIT=$?
                  set -e
                  if [ "$CURL_EXIT" -ne 0 ]; then
                    HTTP_STATUS="curl失敗(exit=$CURL_EXIT)"
                  fi
                  case "${HTTP_STATUS:-}" in
                    200|201|204)
                      echo "app_versions（ios）を更新しました: build=$APP_BUILD_NUMBER" ;;
                    *)
                      echo "app_versions（ios）の更新に失敗しました（HTTP ${HTTP_STATUS:-不明}）。TestFlightへのパブリッシュ自体は成功として扱います。"
                      cat /tmp/app_versions_ios_response.json 2>/dev/null || true ;;
                  esac
                else
                  echo "SUPABASE_SERVICE_ROLE_KEYが未設定のため、app_versionsの更新をスキップしました。"
                fi
              else
                echo "iOSビルドが失敗したため、TestFlightへのパブリッシュをスキップしました。"
                exit 1
              fi
            ) > /tmp/ios_publish.log 2>&1 &
            IOS_PUBLISH_PID=$!

            (
              set -euo pipefail
              HTTP_STATUS=""
              if [ -f /tmp/android_build_success ]; then
                # Codemagicのmacイメージにはfirebase-toolsがプリインストール済みのため、
                # 既にある場合はグローバルインストールをスキップする（EEXISTで失敗するのを防ぐ）。
                if ! command -v firebase >/dev/null 2>&1; then
                  npm install -g firebase-tools
                fi
                # テスターはCodemagic側（このYAML）ではなくFirebase App Distribution側の
                # 「testers」グループで管理する。グループにテスターを追加・削除するだけで
                # 次回配布から自動的に反映され、ここを編集する必要はない。
                # --jsonでテスター向けダウンロードリンク（testingUri）を機械可読な形で取得する。
                FIREBASE_OUTPUT=$(firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
                  --app 1:763009686501:android:22db046778e22c10c1ed0c \
                  --groups "testers" \
                  --token "$FIREBASE_TOKEN" \
                  --json)
                echo "$FIREBASE_OUTPUT"
                # firebase-toolsのバージョンによって--json出力のトップレベル形が変わる
                # ことがあるため、想定されるいくつかの場所を順に試す。
                TESTING_URI=$(echo "$FIREBASE_OUTPUT" | jq -r '.result.testingUri // .testingUri // .release.testingUri // empty')
                echo "テスター向けダウンロードリンク: ${TESTING_URI:-取得できませんでした}"

                # app_versionsテーブルに最新ビルド番号とダウンロードリンクを反映する
                # （SUPABASE_SERVICE_ROLE_KEYが未設定の場合はスキップし、Firebaseへの
                # パブリッシュ自体は成功のまま完了させる）。
                # curlの失敗（-fで非2xx時に非ゼロ終了）がset -eでサブシェル全体を道連れにし、
                # 実際にはFirebaseへの配布が成功しているのに「スキップ」と誤報される事態を
                # 防ぐため、この更新はベストエフォート（失敗してもパブリッシュ成功として扱う）にする。
                if [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
                  set +e
                  HTTP_STATUS=$(curl -sS -o /tmp/app_versions_android_response.json -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/app_versions" \
                    -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                    -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                    -H "Content-Type: application/json" \
                    -H "Prefer: resolution=merge-duplicates" \
                    -d "$(jq -n --arg build "$ANDROID_BUILD_NUMBER" --arg url "$TESTING_URI" \
                      '{platform:"android", latest_build: ($build|tonumber), update_url: $url}')")
                  CURL_EXIT=$?
                  set -e
                  if [ "$CURL_EXIT" -ne 0 ]; then
                    HTTP_STATUS="curl失敗(exit=$CURL_EXIT)"
                  fi
                  case "${HTTP_STATUS:-}" in
                    200|201|204)
                      echo "app_versions（android）を更新しました: build=$ANDROID_BUILD_NUMBER" ;;
                    *)
                      echo "app_versions（android）の更新に失敗しました（HTTP ${HTTP_STATUS:-不明}）。Firebaseへのパブリッシュ自体は成功として扱います。"
                      cat /tmp/app_versions_android_response.json 2>/dev/null || true ;;
                  esac
                else
                  echo "SUPABASE_SERVICE_ROLE_KEYが未設定のため、app_versionsの更新をスキップしました。"
                fi
              else
                echo "Androidビルドが失敗したため、Firebase App Distributionへのパブリッシュをスキップしました。"
                exit 1
              fi
            ) > /tmp/android_publish.log 2>&1 &
            ANDROID_PUBLISH_PID=$!

            # ここで両方のパブリッシュ完了を待ち合わせる（join）。
            wait $IOS_PUBLISH_PID; IOS_PUBLISH_STATUS=$?
            wait $ANDROID_PUBLISH_PID; ANDROID_PUBLISH_STATUS=$?

            echo "----- iOS publish log -----"
            cat /tmp/ios_publish.log
            echo "----- Android publish log -----"
            cat /tmp/android_publish.log

            [ $IOS_PUBLISH_STATUS -eq 0 ] && touch /tmp/ios_publish_success
            [ $ANDROID_PUBLISH_STATUS -eq 0 ] && touch /tmp/android_publish_success

            # このステップ自体は常に成功扱いにし、後続のDiscord通知を必ず実行する
            # （成否はDiscordメッセージ側でフラグを見て報告する）。
            true
        - name: Notify Discord
          script: |
            set -euo pipefail

            COMMIT_HASH=$(echo "${CM_COMMIT}" | cut -c 1-7)

            IOS_LINE="iOS TestFlight：スキップ（ビルドまたはパブリッシュ失敗）"
            if [ -f /tmp/ios_publish_success ]; then
              IOS_LINE="iOS TestFlight：成功＆パブリッシュ済み（Version：${APP_VERSION} / Build：${APP_BUILD_NUMBER}）"
            fi

            ANDROID_LINE="Android Firebase App Distribution：スキップ（ビルドまたはパブリッシュ失敗）"
            if [ -f /tmp/android_publish_success ]; then
              ANDROID_LINE="Android Firebase App Distribution：成功＆パブリッシュ済み（Version：${APP_VERSION} / Build：${ANDROID_BUILD_NUMBER}）"
            fi

            MESSAGE="SavePointのビルドが完了しました。
            ${IOS_LINE}
            ${ANDROID_LINE}
            Commit：${COMMIT_HASH}"

            # jq を使用して安全にJSONを組み立て、Discord WebhookへPOST
            JSON_PAYLOAD=$(jq -n --arg content "$MESSAGE" '{content: $content}')

            curl -H "Content-Type: application/json" \
              -X POST \
              -d "$JSON_PAYLOAD" \
              "$DISCORD_WEBHOOK_URL"
