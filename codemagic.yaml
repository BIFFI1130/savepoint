workflows:
  ios-unsigned-build:
    name: iOS unsigned build (検証用)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # SUPABASE_URL / SUPABASE_ANON_KEY はCodemagicのアプリ設定
      # （Environment variables）にグループなしで個別登録済み。
      # アプリレベルで登録した変数は、groups指定がなくても
      # このアプリの全ワークフローに自動的に注入される。
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Build iOS (署名なし・toolchain検証用)
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
    artifacts:
      - build/ios/iphoneos/*.app

  ios-testflight:
    name: iOS TestFlight配信
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Codemagicダッシュボードで登録したApp Store Connect APIキーの参照名。
      app_store_connect: savepoint_appstore
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.biffi.savepoint
      # SUPABASE_URL / SUPABASE_ANON_KEY はCodemagicのアプリ設定に個別登録済み（groups不要）。
    # 手動トリガーのみ（pushの度にTestFlightへアップロードしないようにするため）。
    # Codemagicダッシュボードの「Start new build」からこのワークフローを選んで実行する。
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for App Store
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --build-number=$CM_BUILD_NUMBER \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
