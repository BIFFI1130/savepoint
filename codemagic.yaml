workflows:
  release:
    name: iOS TestFlight & Android Firebase配信
    max_build_duration: 60
    # iOSのコード署名・ipaビルドにはmacが必須。AndroidのAPKビルドも同じマシン上で
    # バックグラウンドジョブとして並行実行する（詳細は各scriptのコメント参照）。
    instance_type: mac_mini_m2
    integrations:
      # Codemagicダッシュボードで登録したApp Store Connect APIキーの参照名
      app_store_connect: savepoint_appstore
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.biffi.savepoint
      groups:
        # SUPABASE_URL / SUPABASE_ANON_KEY を含むCodemagic側の変数グループ
        - SUPABASE_VARIABLES
        # DISCORD_WEBHOOK_URL を含むCodemagic側の変数グループ（ダッシュボード名と完全一致させてください）
        - DISCORD_VARIABLES
        # FIREBASE_TOKEN（firebase appdistribution:distribute の認証用）を含むCodemagic側の変数グループ
        - FIREBASE_VARIABLES
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Set up code signing settings on Xcode project
        script: |
          # testFlightInternalTestingOnly を付けることで、外部向けベータ版レビューへの
          # 自動提出を行わず、内部テストグループへの配布だけにする。
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Resolve build numbers
        script: |
          set -euo pipefail

          # pubspec.yaml からバージョン名 (例: 1.0.0) を抽出
          APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d '+' -f 1 | tr -d '[:space:]')
          echo "APP_VERSION=$APP_VERSION" >> $CM_ENV

          # App Store Connect上の最新ビルド番号を取得して+1（iOS用）
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "6799825415")
          NEXT_BUILD_NUMBER=$((${LATEST_BUILD_NUMBER%%.*} + 1))
          echo "APP_BUILD_NUMBER=$NEXT_BUILD_NUMBER" >> $CM_ENV

          # pubspec.yaml のバージョン番号（+以降のビルド番号）をAndroidのversionCodeとして使う
          ANDROID_BUILD_NUMBER=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d '+' -f 2 | tr -d '[:space:]')
          echo "ANDROID_BUILD_NUMBER=$ANDROID_BUILD_NUMBER" >> $CM_ENV
      - name: Build iOS ipa and Android APK in parallel
        script: |
          # iOS（xcodebuild）とAndroid（Gradle）は別ツールチェーンのため、同一マシン上でも
          # バックグラウンドジョブ（&）として同時に走らせられる。それぞれをサブシェルにして
          # 個別に `set -euo pipefail` を効かせつつ、外側のスクリプトはwaitの戻り値で
          # 成否を判定する（外側で-eを使うと1つ目のwait失敗で即終了し、2つ目の結果を
          # 待たずにスクリプトが止まってしまうため、あえて付けていない）。
          #
          # 注意: 2つの `flutter build` を同一プロジェクトディレクトリに対して同時実行するため、
          # 稀にFlutter側の内部ロック（Cache/pub取得まわり）で片方が一瞬待たされることがあるが、
          # 処理自体は安全に完了する。ビルド生成物の出力先（build/ios と build/app）は
          # 分かれているため、成果物が競合することはない。

          (
            set -euo pipefail
            flutter build ipa --release \
              --export-options-plist=/Users/builder/export_options.plist \
              --build-number=$APP_BUILD_NUMBER \
              --dart-define=SUPABASE_URL=$SUPABASE_URL \
              --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          ) > /tmp/ios_build.log 2>&1 &
          IOS_BUILD_PID=$!

          (
            set -euo pipefail
            flutter build apk --release \
              --dart-define=SUPABASE_URL=$SUPABASE_URL \
              --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          ) > /tmp/android_build.log 2>&1 &
          ANDROID_BUILD_PID=$!

          # ここで両方のビルド完了を待ち合わせる（join）。
          wait $IOS_BUILD_PID; IOS_BUILD_STATUS=$?
          wait $ANDROID_BUILD_PID; ANDROID_BUILD_STATUS=$?

          echo "----- iOS build log -----"
          cat /tmp/ios_build.log
          echo "----- Android build log -----"
          cat /tmp/android_build.log

          if [ $IOS_BUILD_STATUS -eq 0 ]; then
            touch /tmp/build_success
          else
            echo "iOSビルドが失敗しました（exit=$IOS_BUILD_STATUS）"
          fi

          if [ $ANDROID_BUILD_STATUS -eq 0 ]; then
            touch /tmp/android_build_success
          else
            echo "Androidビルドが失敗しました（exit=$ANDROID_BUILD_STATUS）"
          fi
        # ビルドが失敗してもpublishingフェーズ（パブリッシング・Discord通知）は実行し、
        # 失敗をDiscordに通知できるようにする（成功フラグの有無で成否を判定する）。
        ignore_failure: true
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      scripts:
        - name: Publish iOS and Android in parallel
          script: |
            # iOSはApp Store Connect（TestFlight向けアップロードのみ、グループへの
            # 自動提出はしない）、AndroidはFirebase App Distributionへ、それぞれ
            # バックグラウンドジョブとして同時にパブリッシュし、両方の完了を待ち合わせる。

            (
              set -euo pipefail
              if [ -f /tmp/build_success ]; then
                IPA_PATH=$(find build/ios/ipa -name '*.ipa' | head -n 1)
                app-store-connect publish --path "$IPA_PATH"
              else
                echo "iOSビルドが失敗したため、TestFlightへのパブリッシュをスキップしました。"
                exit 1
              fi
            ) > /tmp/ios_publish.log 2>&1 &
            IOS_PUBLISH_PID=$!

            (
              set -euo pipefail
              if [ -f /tmp/android_build_success ]; then
                # Codemagicのmacイメージにはfirebase-toolsがプリインストール済みのため、
                # 既にある場合はグローバルインストールをスキップする（EEXISTで失敗するのを防ぐ）。
                if ! command -v firebase >/dev/null 2>&1; then
                  npm install -g firebase-tools
                fi
                firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
                  --app 1:763009686501:android:22db046778e22c10c1ed0c \
                  --testers "lanbian38@gmail.com" \
                  --token "$FIREBASE_TOKEN"
              else
                echo "Androidビルドが失敗したため、Firebase App Distributionへのパブリッシュをスキップしました。"
                exit 1
              fi
            ) > /tmp/android_publish.log 2>&1 &
            ANDROID_PUBLISH_PID=$!

            # ここで両方のパブリッシュ完了を待ち合わせる（join）。
            wait $IOS_PUBLISH_PID; IOS_PUBLISH_STATUS=$?
            wait $ANDROID_PUBLISH_PID; ANDROID_PUBLISH_STATUS=$?

            echo "----- iOS publish log -----"
            cat /tmp/ios_publish.log
            echo "----- Android publish log -----"
            cat /tmp/android_publish.log

            [ $IOS_PUBLISH_STATUS -eq 0 ] && touch /tmp/ios_publish_success
            [ $ANDROID_PUBLISH_STATUS -eq 0 ] && touch /tmp/android_publish_success

            # このステップ自体は常に成功扱いにし、後続のDiscord通知を必ず実行する
            # （成否はDiscordメッセージ側でフラグを見て報告する）。
            true
        - name: Notify Discord
          script: |
            set -euo pipefail

            COMMIT_HASH=$(echo "${CM_COMMIT}" | cut -c 1-7)

            IOS_LINE="iOS TestFlight：スキップ（ビルドまたはパブリッシュ失敗）"
            if [ -f /tmp/ios_publish_success ]; then
              IOS_LINE="iOS TestFlight：成功＆パブリッシュ済み（Version：${APP_VERSION} / Build：${APP_BUILD_NUMBER}）"
            fi

            ANDROID_LINE="Android Firebase App Distribution：スキップ（ビルドまたはパブリッシュ失敗）"
            if [ -f /tmp/android_publish_success ]; then
              ANDROID_LINE="Android Firebase App Distribution：成功＆パブリッシュ済み（Version：${APP_VERSION} / Build：${ANDROID_BUILD_NUMBER}）"
            fi

            MESSAGE="SavePointのビルドが完了しました。
            ${IOS_LINE}
            ${ANDROID_LINE}
            Commit：${COMMIT_HASH}"

            # jq を使用して安全にJSONを組み立て、Discord WebhookへPOST
            JSON_PAYLOAD=$(jq -n --arg content "$MESSAGE" '{content: $content}')

            curl -H "Content-Type: application/json" \
              -X POST \
              -d "$JSON_PAYLOAD" \
              "$DISCORD_WEBHOOK_URL"
