workflows:
  ios-testflight:
    name: iOS TestFlight配信
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Codemagicダッシュボードで登録したApp Store Connect APIキーの参照名
      app_store_connect: savepoint_appstore
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.biffi.savepoint
      groups:
        # SUPABASE_URL / SUPABASE_ANON_KEY を含むCodemagic側の変数グループ
        - SUPABASE_VARIABLES
        # DISCORD_WEBHOOK_URL を含むCodemagic側の変数グループ（ダッシュボード名と完全一致させてください）
        - DISCORD_VARIABLES
        # FIREBASE_TOKEN（firebase appdistribution:distribute の認証用）を含むCodemagic側の変数グループ
        - FIREBASE_VARIABLES
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Set up code signing settings on Xcode project
        script: |
          # testFlightInternalTestingOnly を付けることで、外部向けベータ版レビューへの
          # 自動提出を行わず、内部テストグループへの配布だけにする。
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Build ipa for App Store
        script: |
          # 1. pubspec.yaml からバージョン名 (例: 1.0.0) を抽出
          APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d '+' -f 1 | tr -d '[:space:]')
          
          # 2. App Store Connect上の最新ビルド番号を取得して+1
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "6799825415")
          NEXT_BUILD_NUMBER=$((${LATEST_BUILD_NUMBER%%.*} + 1))
          
          # 3. publishingステップへ変数を引き継ぐために $CM_ENV に書き出し
          echo "APP_VERSION=$APP_VERSION" >> $CM_ENV
          echo "APP_BUILD_NUMBER=$NEXT_BUILD_NUMBER" >> $CM_ENV

          # 4. ビルド実行
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --build-number=$NEXT_BUILD_NUMBER \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

          # 5. ビルド成功フラグを作成
          touch /tmp/build_success
      - name: Build APK for Android
        script: |
          flutter build apk --release --dart-define-from-file=env/dev.json

          # ビルド成功フラグを作成（Android版のpublishingステップの実行判定に使う）
          touch /tmp/android_build_success
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
      scripts:
        - name: Publish Android to Firebase App Distribution
          script: |
            # Androidビルドが成功した場合のみFirebase App Distributionへ配信する
            if [ -f /tmp/android_build_success ]; then
              npm install -g firebase-tools

              firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
                --app 1:763009686501:android:22db046778e22c10c1ed0c \
                --testers "lanbian38@gmail.com" \
                --token "$FIREBASE_TOKEN"
            else
              echo "Androidビルドが失敗したかスキップされたため、Firebase App Distributionへのパブリッシュをスキップしました。"
            fi
        - name: Notify Discord
          script: |
            # ビルド成功フラグが存在する場合のみDiscord通知を送信
            if [ -f /tmp/build_success ]; then
              # コミットハッシュの先頭7文字を取得
              COMMIT_HASH=$(echo "${CM_COMMIT}" | cut -c 1-7)

              # 送信メッセージの作成
              MESSAGE=$(cat <<EOF
            iOS版TestFlightビルドが成功＆パブリッシュされました。
            Version：${APP_VERSION}
            Version Code：${APP_BUILD_NUMBER}
            Commit：${COMMIT_HASH}
            EOF
              )

              # jq を使用して安全にJSONを組み立て、Discord WebhookへPOST
              JSON_PAYLOAD=$(jq -n --arg content "$MESSAGE" '{content: $content}')
              
              curl -H "Content-Type: application/json" \
                -X POST \
                -d "$JSON_PAYLOAD" \
                "$DISCORD_WEBHOOK_URL"
            else
              echo "ビルドが失敗したかスキップされたため、Discord通知を送信しませんでした。"
            fi